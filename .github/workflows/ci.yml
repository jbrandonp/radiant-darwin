name: CI / Industrial Quality Gate

on:
  push:
    branches: [ master, main ]
    tags: [ 'audit-*', 'v*' ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  test-and-audit:
    name: Test & Audit (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Linux System Graphics Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libgl1-mesa-dev \
            libegl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxcomposite1 \
            libxdamage1 \
            libxrender1 \
            libxtst6 \
            xvfb

      - name: Upgrade Pip & Install Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Radiant-Darwin Package and Dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run Headless Pytest Suite (Linux)
        if: runner.os == 'Linux'
        run: |
          export QT_QPA_PLATFORM=offscreen
          xvfb-run -a pytest tests/ -v --durations=10

      - name: Run Headless Pytest Suite (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          pytest tests/ -v --durations=10

      - name: Run Industrial Audit Engine (Strict Typing & Quality Gate)
        run: |
          python scripts/industrial_audit_engine.py

      - name: Generate and Validate SARIF v2.1.0 Security Report
        run: |
          python scripts/sarif_generator.py --output audit-results.sarif --validate

      - name: Upload SARIF to GitHub Security (Code Scanning)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: audit-results.sarif
          category: audit-${{ matrix.os }}-py${{ matrix.python-version }}

      - name: Upload HTML Audit Report and Badges Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report-html-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            docs/audit_report.html
            docs/badges/*.svg
            docs/audit_summary.md

      - name: Run Headless CLI Verification
        run: |
          python -m src.cli --version
          python -m src.cli audit
