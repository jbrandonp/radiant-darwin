<svg xmlns="http://www.w3.org/2000/svg" width="124" height="20" role="img" aria-label="strict typing: 100%">
  <title>strict typing: 100%</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="124" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="80" height="20" fill="#555"/>
    <rect x="80" width="44" height="20" fill="#2ea44f"/>
    <rect width="124" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text aria-hidden="true" x="400" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="666">strict typing</text>
    <text x="400" y="140" transform="scale(.1)" fill="#fff" textLength="666">strict typing</text>
    <text aria-hidden="true" x="1020" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="303">100%</text>
    <text x="1020" y="140" transform="scale(.1)" fill="#fff" textLength="303">100%</text>
  </g>
</svg>