[pytest]
pythonpath = .
testpaths = tests
addopts = -p no:cov
filterwarnings =
    default
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:OpenGL.*
markers =
    unit: Tests unitaires isoles de composants et fonctions mathematiques
    integration: Tests d integration de pipelines multi-ateliers
    architecture: Tests de conformite architecturale, couplage et qualite ISO 25010
    cad_kernel: Tests du noyau geometrique B-Rep, NURBS, CSG et topologie
    multiphysics: Tests des solveurs FEA, CFD OpenFOAM, CalculiX et CAM 5-axes
    property_based: Tests bases sur les proprietes formelles et fuzzing Hypothesis
