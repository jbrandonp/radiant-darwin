name: CI / Industrial Quality Gate

on:
  push:
    branches: [ master, main ]
    tags: [ 'audit-*', 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write
  pages: write
  id-token: write

jobs:
  # ============================================================================
  # 1. Matrice de Tests Multi-OS avec Rendu Headless Déterministe
  # ============================================================================
  test-matrix:
    name: Test Suite (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Linux Graphics & Xvfb Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libgl1-mesa-dev \
            libegl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxcomposite1 \
            libxdamage1 \
            libxrender1 \
            libxtst6 \
            xvfb

      - name: Upgrade Pip & Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Radiant-Darwin Package and Dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run Headless Pytest Suite (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          export QT_QPA_PLATFORM=offscreen
          xvfb-run -a --server-args="-screen 0 1920x1080x24" pytest tests/ -v --durations=10

      - name: Run Headless Pytest Suite (Windows Offscreen)
        if: runner.os == 'Windows'
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          pytest tests/ -v --durations=10

      - name: Run Headless Pytest Suite (macOS Offscreen)
        if: runner.os == 'macOS'
        run: |
          export QT_QPA_PLATFORM=offscreen
          pytest tests/ -v --durations=10

      - name: Verify Headless CLI Operations
        run: |
          python -m src.cli --version
          python -m src.cli audit
          python -m src.cli audit-skills

  # ============================================================================
  # 2. Audit Industriel, SARIF SAST, SBOM CycloneDX & OpenSSF Scorecard
  # ============================================================================
  audit-security-and-supply-chain:
    name: Industrial Audit, SARIF SAST & SBOM CycloneDX
    runs-on: ubuntu-latest
    needs: [ test-matrix ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux Graphics & Xvfb Dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-glx \
            libgl1-mesa-dev \
            libegl1 \
            libxkbcommon0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxcomposite1 \
            libxdamage1 \
            libxrender1 \
            libxtst6 \
            xvfb

      - name: Upgrade Pip & Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Package and Dev Dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run Deterministic Industrial Audit Engine & Quality Gate
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          export QT_QPA_PLATFORM=offscreen
          xvfb-run -a python scripts/industrial_audit_engine.py --cold --html --sarif

      - name: Validate SARIF v2.1.0 Security Report
        run: |
          python scripts/sarif_generator.py --output audit-results.sarif --validate

      - name: Upload SARIF to GitHub Security (Code Scanning Alerts)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: audit-results.sarif
          category: industrial-sast-audit

      - name: Run Supply Chain Audit & Generate CycloneDX v1.5 SBOM
        run: |
          python scripts/supply_chain_auditor.py --sbom sbom.json --report audit_report_supply_chain.json --strict

      - name: Submit SBOM Snapshot to GitHub Dependency Graph
        uses: anchore/sbom-action@v0.24.3
        if: always()
        continue-on-error: true
        with:
          path: .
          format: cyclonedx-json
          dependency-snapshot: true

      - name: Prepare GitHub Pages Static Site
        run: |
          cp docs/audit_report.html docs/index.html

      - name: Upload Audit Reports, Badges and SBOM Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: industrial-audit-and-security-artifacts
          path: |
            docs/audit_report.html
            docs/audit_summary.md
            docs/badges/*.svg
            audit_report_latest.json
            audit_report_supply_chain.json
            quality_gate_verdict.json
            audit-results.sarif
            sbom.json

      - name: Setup GitHub Pages Configuration
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

  # ============================================================================
  # 3. Déploiement du Dashboard Qualité Interactif sur GitHub Pages
  # ============================================================================
  deploy-github-pages:
    name: Publish Audit Dashboard to GitHub Pages
    runs-on: ubuntu-latest
    needs: [ audit-security-and-supply-chain ]
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
